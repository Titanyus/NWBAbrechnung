default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  username: <%= ENV.fetch("POSTGRES_USER", "nwb") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
development:
  <<: *default
  database: nwb_development
test:
  <<: *default
  database: nwb_test
production:
  <<: *default
  database: nwb_production
