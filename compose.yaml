services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: nwb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?use bin/dev-env}
      POSTGRES_DB: nwb_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nwb -d nwb_development']
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: .
    environment:
      RAILS_ENV: development
      PIDFILE: /tmp/nwb-server.pid
      RAILS_LOG_TO_STDOUT: "1"
      SESSION_COOKIE_KEY: ${SESSION_COOKIE_KEY:-_nwb_session}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?use bin/dev-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      DEMO_SIZE: ${DEMO_SIZE:-small}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?use bin/dev-env}
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:${NWB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    networks: [database, web]
    command: [sh, -c, 'bin/rails db:prepare && exec bin/rails server -b 0.0.0.0 -p 3000']
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, 'exit(Net::HTTP.get_response(URI("http://127.0.0.1:3000/up")).code == "200" ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
networks:
  database:
    internal: true
  web: {}
